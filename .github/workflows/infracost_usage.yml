name: Infracost Checks

on:
  pull_request:
    types: [opened, synchronize, closed]
  push:
    branches:
      - main
    paths:
      - terraform/**

jobs:
  EXEC_INFRACOST:
  name: Infracost Checks
    uses: davidlimacardoso/github-actions/.github/workflows/infracost.yml@master
    secrets:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
